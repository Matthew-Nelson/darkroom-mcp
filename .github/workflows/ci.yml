name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; it needs no secrets and gets no write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The engines floor (22) and every newer LTS line, since npx runs Darkroom on the user's Node.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Typecheck, lint, and tests: mock provider only, no GPU, network, or API keys.
      - run: npm run check
